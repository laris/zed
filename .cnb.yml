# CNB workspace build for the Zed YOLO fork.
# Source base: zed-industries/zed v1.1.4-pre.
#
# This is a Stage-1 Linux -> macOS compile path. It does not produce a signed
# .app/.dmg yet; local macOS or a later rcodesign stage should bundle/sign.
$:
  vscode:
    - name: zed-yolo-macos-compile
      runner:
        cpus: 64
        tags: cnb:arch:amd64
      docker:
        build:
          dockerfile: .cnb/Dockerfile.zed-macos
          by:
            - .cnb/Dockerfile.zed-macos
            - Cargo.toml
            - Cargo.lock
            - rust-toolchain.toml
        volumes:
          - zed-yolo-cargo-registry:/usr/local/cargo/registry:rw
          - zed-yolo-cargo-git:/usr/local/cargo/git:rw
          - zed-yolo-sccache:/var/cache/sccache:rw
          - zed-yolo-target:/workspace/target:rw
      services:
        - name: vscode
          options:
            onlyPreview: true
            keepAliveTimeout: 30m
      env:
        CARGO_INCREMENTAL: "0"
        CARGO_TERM_COLOR: always
        CARGO_TERM_PROGRESS_WHEN: always
        CARGO_TERM_PROGRESS_WIDTH: "120"
        BUILD_LOG_POLL_SECONDS: "5"
        BUILD_HEARTBEAT_SECONDS: "60"
        RUSTC_WRAPPER: sccache
        SCCACHE_DIR: /var/cache/sccache
        SCCACHE_CACHE_SIZE: 80G
        RELEASE_TAG: zed-yolo-v1.1.4-pre-enhanced
      stages:
        - name: toolchain
          script: |
            set -eux
            rustc -Vv
            cargo -V
            cargo zigbuild --help >/dev/null
            zig version
            printf 'SDKROOT=%s\n' "${SDKROOT:-}"
            test -n "${SDKROOT:-}"
            test -d "$SDKROOT"
            test -e "$SDKROOT/usr/lib/libclang_rt.osx.a"
            test -e "$SDKROOT/System/Library/Frameworks/Appkit.framework/Appkit.tbd"
            test -d "$SDKROOT/System/Library/Frameworks/ScreenCaptureKit.framework"
            sccache --show-stats || true
        - name: generate-licenses
          script: |
            set -eux
            ALLOW_MISSING_LICENSES=yes script/generate-licenses
        - name: init-release-metadata
          script: bash .cnb/run-zed-build-step.sh metadata
        - name: build-aarch64-apple-darwin-zed-cli
          script: >
            bash .cnb/run-zed-build-step.sh build
            aarch64-apple-darwin zed-cli
            --package zed --package cli
        - name: build-aarch64-apple-darwin-remote-server
          script: >
            bash .cnb/run-zed-build-step.sh build
            aarch64-apple-darwin remote-server
            --package remote_server
        - name: package-aarch64-apple-darwin
          script: bash .cnb/run-zed-build-step.sh package aarch64-apple-darwin
        - name: build-x86_64-apple-darwin-zed-cli
          script: >
            bash .cnb/run-zed-build-step.sh build
            x86_64-apple-darwin zed-cli
            --package zed --package cli
        - name: build-x86_64-apple-darwin-remote-server
          script: >
            bash .cnb/run-zed-build-step.sh build
            x86_64-apple-darwin remote-server
            --package remote_server
        - name: package-x86_64-apple-darwin
          script: bash .cnb/run-zed-build-step.sh package x86_64-apple-darwin
        - name: build-cache-stats
          script: bash .cnb/run-zed-build-step.sh stats
        - name: upload-workspace-artifacts
          image: cnbcool/attachments:latest
          settings:
            tag: $RELEASE_TAG
            attachments:
              - "dist/zed-yolo-v*.tar.zst"
              - "dist/zed-yolo-v*.tar.zst.sha256"
              - "dist/zed-yolo-v*.tar.zst.build.json"
        - name: cleanup-workspace-dist
          script: |
            set -eux
            find dist -maxdepth 1 -type f -name 'zed-yolo-v*' -print || true
            rm -rf dist
            git status --short --untracked-files=all
